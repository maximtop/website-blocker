name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run quality checks
        run: pnpm check
      - name: Build release extensions
        run: pnpm release
      - name: Verify built manifests
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(jq -er '.version' package.json)"
          for BROWSER in chrome edge firefox; do
            MANIFEST="dist/release/$BROWSER/manifest.json"
            BUILT_VERSION="$(jq -er '.version' "$MANIFEST")"
            if [[ "$BUILT_VERSION" != "$PACKAGE_VERSION" ]]; then
              echo "$MANIFEST version $BUILT_VERSION != package.json $PACKAGE_VERSION" >&2
              exit 1
            fi
            test -f "dist/release/$BROWSER.zip"
          done
          node -e "
            const chrome = require('./dist/release/chrome/manifest.json');
            const firefox = require('./dist/release/firefox/manifest.json');
            if (!chrome.background.service_worker) throw new Error('chrome: no service worker');
            if (!Array.isArray(firefox.background.scripts)) throw new Error('firefox: no background scripts');
            if (!firefox.browser_specific_settings?.gecko?.id) throw new Error('firefox: no gecko id');
          "
      - name: Retain extension archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-archives
          path: |
            dist/release/chrome.zip
            dist/release/edge.zip
            dist/release/firefox.zip
          if-no-files-found: error
          retention-days: 14
